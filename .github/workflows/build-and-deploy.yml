name: Build and Deploy Firmware

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache PlatformIO
        uses: actions/cache@v3
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-${{ hashFiles('**/lockfiles') }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Run PlatformIO Build
        working-directory: firmware
        run: pio run

      - name: Prepare Web Assets
        run: |
          mkdir -p dist/firmware
          cp -r web/* dist/
          # Copy compiled binaries to the dist folder for ESP Web Tools
          cp firmware/.pio/build/esp32-c3-devkitm-1/bootloader.bin dist/firmware/
          cp firmware/.pio/build/esp32-c3-devkitm-1/partitions.bin dist/firmware/
          cp firmware/.pio/build/esp32-c3-devkitm-1/firmware.bin dist/firmware/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
